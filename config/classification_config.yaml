# Gap Classification Configuration - CALIBRATED
# Based on Day 24 test results: scores range 0.27-0.89

thresholds:
  aligned:
    min_score: 0.70      # Raised from 0.15
    max_score: 1.00
    description: "Strong policy coverage - no action needed"
    action: "No action needed"
  
  partial:
    min_score: 0.40      # Raised from 0.05
    max_score: 0.69      # Just below aligned
    description: "Partial coverage - review recommended"
    action: "Manual review recommended"
  
  gap:
    min_score: 0.00
    max_score: 0.39      # Below partial
    description: "Inadequate or missing policy coverage"
    action: "Policy update required"

confidence_weights:
  cross_encoder: 0.50
  bi_encoder: 0.25
  candidate_rank: 0.15
  score_variance: 0.10

scoring:
  bi_encoder_weight: 0.30
  cross_encoder_weight: 0.70
  
  confidence_levels:
    high: 0.80
    medium: 0.60
    low: 0.00

visualization:
  score_bins: 20
  show_distribution: true
  highlight_thresholds: true